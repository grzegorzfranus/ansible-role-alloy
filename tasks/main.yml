---
# =============================================================================
# Ansible Role: Alloy - Tasks: Main Entrypoint
# =============================================================================
# Flow: include_vars → assert → prerequisites → install → configure → service (or remove)
# =============================================================================

- name: Alloy | main | Load OS-specific variable overrides
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['os_family'] }}.yml"
        - "default.yml"
      skip: true

- name: Alloy | main | Run configuration assertions
  ansible.builtin.include_tasks: assert.yml

- name: "Alloy | main | Execute lifecycle tasks for state: present"
  when: alloy_state == 'present'
  block:
    - name: Alloy | main | Run prerequisite tasks
      ansible.builtin.include_tasks: prerequisites.yml

    - name: Alloy | main | Run installation tasks
      ansible.builtin.include_tasks: install.yml

    - name: Alloy | main | Run configuration tasks
      ansible.builtin.include_tasks: configure.yml

    - name: Alloy | main | Run service management tasks
      ansible.builtin.include_tasks: service.yml

- name: "Alloy | main | Execute removal tasks for state: absent"
  ansible.builtin.include_tasks: remove.yml
  when: alloy_state == 'absent'

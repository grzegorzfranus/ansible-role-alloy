---
# =============================================================================
# Ansible Role: Alloy - Tasks: Main Entrypoint
# =============================================================================
# Flow: include_vars → assert → prerequisites → install → configure → service (or remove)
# =============================================================================

- name: Alloy | include_vars | Gather OS specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  tags:
    - always
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
        - "{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_major_version'] | lower }}.yml"
        - "{{ ansible_facts['distribution'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_version'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}_{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}.yml"
        - "main.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Alloy | main | Run configuration assertions
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always
    - alloy_validate

- name: "Alloy | main | Execute lifecycle tasks for state: present"
  when: alloy_state | lower == 'present'
  block:
    - name: Alloy | main | Run prerequisite tasks
      ansible.builtin.import_tasks: prerequisites.yml
      tags:
        - alloy_setup
        - alloy_init
        - alloy_requirements

    - name: Alloy | main | Run installation tasks
      ansible.builtin.import_tasks: install.yml
      tags:
        - alloy_setup
        - alloy_install

    - name: Alloy | main | Run configuration tasks
      ansible.builtin.import_tasks: configure.yml
      tags:
        - alloy_setup
        - alloy_configure

    - name: Alloy | main | Run service management tasks
      ansible.builtin.import_tasks: service.yml
      tags:
        - alloy_setup
        - alloy_service

- name: "Alloy | main | Execute removal tasks for state: absent"
  ansible.builtin.import_tasks: remove.yml
  when: alloy_state | lower == 'absent'
  tags:
    - alloy_remove

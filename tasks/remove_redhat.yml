---
# =============================================================================
# Ansible Role: Alloy - Tasks: Removal (RedHat)
# =============================================================================
# Uninstalls Grafana Alloy DNF package on RedHat/EL.
# =============================================================================

- name: Alloy | remove | Remove Grafana Alloy package (RedHat)
  become: "{{ alloy_become }}"
  ansible.builtin.dnf:
    name: alloy
    state: absent

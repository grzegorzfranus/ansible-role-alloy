---
# =============================================================================
# Ansible Role: Alloy - Tasks: Service Management
# =============================================================================
# Manages systemd service state for Grafana Alloy.
# =============================================================================

- name: Alloy | service | Ensure Grafana Alloy service state
  become: true
  ansible.builtin.systemd:
    name: "{{ __alloy_service_name }}"
    state: "{{ alloy_service_enabled | ternary('started', 'stopped') }}"
    enabled: "{{ alloy_service_enabled }}"
  when: alloy_manage_service_restart | bool

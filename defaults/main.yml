---
# =============================================================================
# Ansible Role: Alloy - Default Variables
# =============================================================================
# Purpose: Define baseline configuration for Grafana Alloy log shipping agent.
# All default values documented here can be overridden in inventory or playbooks.
#
# Supported OS distributions:
# - Ubuntu 26.04 (Resolute), 24.04 (Noble), 22.04 (Jammy)
# - Debian 13 (Trixie), 12 (Bookworm), 11 (Bullseye)
# - EL9: Rocky Linux 9, RHEL 9, AlmaLinux 9
#
# Sections:
#   1. Service State (Lifecycle)
#   2. Version and Package Settings
#   3. General Settings
#   4. Loki Push Target & Multi-Tenancy
#   5. Log Collection Sources
#   6. Systemd Hardening & Execution
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Service State (Lifecycle)
# -----------------------------------------------------------------------------

# Target lifecycle state for the Grafana Alloy telemetry agent
# Valid values: present, absent
alloy_state: "present"

# -----------------------------------------------------------------------------
# 2. Version and Package Settings
# -----------------------------------------------------------------------------

# Pinned release version for Grafana Alloy package
# Valid values: SemVer string e.g. "1.7.1" (never "latest")
alloy_version: "1.7.1"

# APT/YUM GPG key URL for Grafana package repository
# Valid values: valid URL string
alloy_repo_gpg_key: "https://apt.grafana.com/gpg.key"

# APT repository specification for Grafana packages
# Valid values: APT repository line string
alloy_apt_repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"

# YUM/DNF repository base URL for Grafana packages
# Valid values: valid repository URL string
alloy_yum_repo_baseurl: "https://rpm.grafana.com"

# -----------------------------------------------------------------------------
# 3. General Settings
# -----------------------------------------------------------------------------

# Enable systemd service auto-start on boot
# Valid values: true, false
alloy_service_enabled: true

# Manage service restarts on configuration change
# Valid values: true, false
alloy_manage_service_restart: true

# User account under which Grafana Alloy daemon runs
# Valid values: string identifier
alloy_user: "alloy"

# Group account for Grafana Alloy daemon
# Valid values: string identifier
alloy_group: "alloy"

# -----------------------------------------------------------------------------
# 4. Loki Push Target & Multi-Tenancy
# -----------------------------------------------------------------------------

# Loki push endpoint URL (e.g. http://192.0.2.10:3100/loki/api/v1/push)
# Valid values: HTTP/HTTPS URL string
alloy_loki_url: ""

# Mandatory Loki tenant identifier emitted as X-Scope-OrgID header
# Security note: Loki rejects pushes with HTTP 401 if tenant_id is empty or missing
# Valid values: string e.g. "management", "nonprod", "production"
alloy_tenant_id: ""

# Custom extra labels attached to all shipped log entries
# Valid values: dictionary of key-value string pairs
alloy_custom_labels: {}

# -----------------------------------------------------------------------------
# 5. Log Collection Sources
# -----------------------------------------------------------------------------

# Enable systemd journald log collection
# Valid values: true, false
alloy_enable_journald_logs: true

# Enable Docker container log collection (requires Docker socket)
# Valid values: true, false
alloy_enable_docker_logs: false

# Path to local Docker daemon unix socket
# Valid values: socket path string
alloy_docker_socket_path: "unix:///var/run/docker.sock"

# -----------------------------------------------------------------------------
# 6. Systemd Hardening & Execution
# -----------------------------------------------------------------------------

# Enable systemd security sandboxing for alloy.service
# Valid values: true, false
alloy_systemd_hardening_enabled: true

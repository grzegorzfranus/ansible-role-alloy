---
# =============================================================================
# Ansible Role: Alloy - Argument Specifications
# =============================================================================
argument_specs:
  main:
    short_description: Deploy and configure Grafana Alloy log shipping agent
    description:
      - Installs Grafana Alloy via native package management (apt/yum).
      - Configures journald and Docker log collection shipping to Loki.
      - Enforces mandatory X-Scope-OrgID multi-tenant header assertions.
    options:
      alloy_state:
        type: str
        default: present
        choices: [present, absent]
        description: Lifecycle state of the Alloy service and package.
      alloy_version:
        type: str
        default: "1.7.1"
        description: Pinned version string of Grafana Alloy.
      alloy_repo_gpg_key:
        type: str
        default: "https://apt.grafana.com/gpg.key"
        description: GPG key URL for Grafana package repository.
      alloy_apt_repo:
        type: str
        default: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
        description: APT repository specification line for Grafana packages.
      alloy_yum_repo_baseurl:
        type: str
        default: "https://rpm.grafana.com"
        description: YUM/DNF repository base URL for Grafana packages.
      alloy_become:
        type: bool
        default: true
        description: Use privilege escalation for role tasks.
      alloy_service_enabled:
        type: bool
        default: true
        description: Enable alloy service on boot.
      alloy_manage_service_restart:
        type: bool
        default: true
        description: Restart service on configuration change.
      alloy_user:
        type: str
        default: alloy
        description: System user for the Alloy service.
      alloy_group:
        type: str
        default: alloy
        description: System group for the Alloy service.
      alloy_loki_url:
        type: str
        required: true
        description: Loki push endpoint URL (e.g. http://100.95.91.122:3100/loki/api/v1/push).
      alloy_tenant_id:
        type: str
        required: true
        description: Mandatory Loki tenant identifier (X-Scope-OrgID header).
      alloy_custom_labels:
        type: dict
        default: {}
        description: Additional key-value labels attached to shipped logs.
      alloy_enable_journald_logs:
        type: bool
        default: true
        description: Collect logs from systemd journald.
      alloy_enable_docker_logs:
        type: bool
        default: false
        description: Collect logs from Docker containers via Docker socket.
      alloy_docker_socket_path:
        type: str
        default: "unix:///var/run/docker.sock"
        description: Docker daemon socket path.
      alloy_systemd_hardening_enabled:
        type: bool
        default: true
        description: Enable systemd security hardening override.

---
# =============================================================================
# Ansible Role: Alloy - Handlers
# =============================================================================
# Systemd daemon reload and service restart handlers for Grafana Alloy.
# =============================================================================

- name: Alloy | handlers | Reload systemd daemon
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Alloy | handlers | Restart alloy service
  become: true
  ansible.builtin.systemd:
    name: "{{ __alloy_service_name }}"
    state: restarted
  when:
    - alloy_service_enabled | bool
    - alloy_manage_service_restart | bool
